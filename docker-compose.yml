services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careslot
      POSTGRES_PASSWORD: careslot
      POSTGRES_DB: careslot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careslot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/careslot
      DATABASE_USER: careslot
      DATABASE_PASSWORD: careslot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SEED_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-in-production-0123456789abcdef}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
